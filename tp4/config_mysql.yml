---
- hosts: serveur
  remote_user: ubuntu
  become: true

  vars:
    peer: "{{ groups['serveur'] | difference([inventory_hostname]) | first }}"
    peer_ip: "{{ hostvars[peer].ansible_host }}"

  roles:
    - python_bib
    - installation
    - securisation
    - common
    - master
    - slave
    - creation
    

