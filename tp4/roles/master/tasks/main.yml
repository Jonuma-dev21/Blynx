

- name: Créer user réplication
  community.mysql.mysql_user:
    name: "{{ replication_user }}"
    password: "{{ replication_pass }}"
    host: "{{ replication_host }}"
    priv:
      "*.*": "REPLICATION SLAVE"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock



- name: Récupérer le statut du Master (binlog et position)
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    query: "SHOW MASTER STATUS;"
  register: master_status_raw

- name: Extraire master_log_file et master_log_pos
  set_fact:
    master_log_file: "{{ master_status_raw.query_result[0][0].File }}"
    master_log_pos: "{{ master_status_raw.query_result[0][0].Position | int }}"

