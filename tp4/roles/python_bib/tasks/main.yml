---

- name: Installer les dépendances système pour Python MySQL
  package:
    name:
      - python3-pip
      - python3-dev
      - build-essential
      - libmysqlclient-dev
    state: present
  when: ansible_os_family == "Debian"


- name: Installer PyMySQL via paquet Debian
  package:
    name: python3-pymysql
    state: present
  when: ansible_os_family == "Debian"
