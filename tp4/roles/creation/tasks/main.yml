---

- name: Créer la base de données pour l'école
  community.mysql.mysql_db:
    name: "{{ mysql_db }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Créer un utilisateur MySQL pour accès distant
  community.mysql.mysql_user:
    name: "{{ mysql_default_user }}"
    password: "{{ mysql_user_password }}"
    host: "{{ mysql_user_host }}"
    priv: "{{ mysql_db }}.*:ALL,GRANT"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Créer la table etudiant dans la base ecole
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    login_db: "{{ mysql_db }}"
    query: |
      CREATE TABLE IF NOT EXISTS etudiant (
        id INT AUTO_INCREMENT PRIMARY KEY,
        nom VARCHAR(50) NOT NULL,
        age INT NOT NULL
      );