---
- hosts: serveur
  remote_user: ubuntu
  become: true

  vars:
    peer: "{{ groups['serveur'] | difference([inventory_hostname]) | first }}"
    peer_ip: "{{ hostvars[peer].ansible_host }}"

  roles:
    - common
    - master
    - slave
    - creation

- hosts: proxy
  become: true
  roles:
    - haproxy
