---
- name: Stop replication before changing master
  community.mysql.mysql_replication:
    mode: stopreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Reset replication info
  community.mysql.mysql_replication:
    mode: resetreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Se connecter au master peer
  community.mysql.mysql_replication:
    mode: changeprimary
    primary_host: "{{ peer_ip }}"
    primary_user: "{{ replication_user }}"
    primary_password: "{{ replication_pass }}"
    primary_log_file: "{{ hostvars[peer].my_log_file }}"
    primary_log_pos: "{{ hostvars[peer].my_log_pos }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  notify: Restart mysql 

- name: Démarrer la réplication
  community.mysql.mysql_replication:
    mode: startreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock