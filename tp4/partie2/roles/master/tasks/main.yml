

- name: Créer user réplication
  community.mysql.mysql_user:
    name: "{{ replication_user }}"
    password: "{{ replication_pass }}"
    host: "{{ replication_host }}"
    priv:
      "*.*": "REPLICATION SLAVE"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  notify: Restart mysql

- name: Récupérer le statut du Master (binlog et position)
  command: "mysql -u root -p{{ mysql_root_password }} -e 'SHOW MASTER STATUS;'"
  register: master_status_raw
  run_once: true

- set_fact:
    master_status_split: "{{ master_status_raw.stdout_lines[1].split('\t') }}"
  run_once: true

- name: Extraire master_log_file et master_log_pos
  set_fact:
    master_log_file: "{{ master_status_split[0] }}"
    master_log_pos: "{{ master_status_split[1] | int }}"
  run_once: true


- name: Définir fact pour l’utilisation par le rôle slave
  set_fact:
    my_log_file: "{{ master_log_file }}"
    my_log_pos: "{{ master_log_pos }}"
  run_once: true
