---
- name: Reset and restart MySQL replication
  hosts: serveur
  remote_user: ubuntu
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:

    - name: Stop replication
      community.mysql.mysql_replication:
        mode: stopreplica
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Reset replication info
      community.mysql.mysql_replication:
        mode: resetreplica
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock


    - name: Start replication
      community.mysql.mysql_replication:
        mode: startreplica
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
