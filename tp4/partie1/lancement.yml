- name: Installer et configurer MySQL pour accès distant
  hosts: sgbd
  become: true
  vars:
    mysql_root_password: "root"
    mysql_default_user: "jonuma"
    mysql_user_password: "bzibzi"
    mysql_user_host: "%"
  tasks:

    - name: Installer MySQL
      apt:
        name: mysql-server
        state: present
        update_cache: yes

    - name: S'assurer que MySQL est démarré
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Créer un utilisateur MySQL pour test distant
      ansible.builtin.shell: mysql -u root -p{{mysql_root_password}} -e "CREATE USER IF NOT EXISTS '{{ mysql_default_user }}'@'{{ mysql_user_host }}' IDENTIFIED BY '{{ mysql_user_password }}'; GRANT ALL PRIVILEGES ON *.* TO '{{ mysql_default_user }}'@'{{ mysql_user_host }}' WITH GRANT OPTION; FLUSH PRIVILEGES;"


    - name: Configurer MySQL pour accepter les connexions distantes
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes

    - name: Redémarrer MySQL
      service:
        name: mysql
        state: restarted


- name: Installer client sur la machine mvd1
  hosts: client
  become: true
  tasks:
    - name: Installer mysql-client
      apt:
        name: mysql-client
        state: present
        update_cache: yes
