---
- name: Installer et configurer MySQL pour accès distant
  hosts: sgbd
  become: true
  vars:
    mysql_root_password: "Chiko2100"
    mysql_default_user: "jonuma"
    mysql_user_password: "bzibzi"
    mysql_user_host: "%"
  tasks:

  
    - name: Installer MySQL
      ansible.builtin.apt:
        name: mysql-server
        state: present
        update_cache: yes

    - name: S'assurer que MySQL est démarré
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: yes



    #  Définir le mot de passe root 
    - name: Définir le mot de passe root MySQL
      community.mysql.mysql_user:
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        check_implicit_admin: true
        login_unix_socket: /run/mysqld/mysqld.sock
        state: present

    #  Créer l’utilisateur distant avec droits 
    - name: Créer un utilisateur MySQL pour accès distant
      community.mysql.mysql_user:
        name: "{{ mysql_default_user }}"
        password: "{{ mysql_user_password }}"
        host: "{{ mysql_user_host }}"
        priv: "*.*:ALL,GRANT"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    # Modifier la configuration pour accepter les connexions distantes
    - name: Autoriser les connexions distantes à MySQL
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes

    #  Redémarrer le service MySQL
    - name: Redémarrer MySQL
      ansible.builtin.service:
        name: mysql
        state: restarted



- name: Installer le client MySQL
  hosts: client
  become: true
  tasks:
    - name: Installer mysql-client
      ansible.builtin.apt:
        name: mysql-client
        state: present
        update_cache: yes
