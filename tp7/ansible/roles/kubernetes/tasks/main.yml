---
- name: Ajouter keyring Kubernetes
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Ajouter repo Kubernetes officiel
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
    mode: "0644"

- name: Installer kubelet kubeadm kubectl
  apt:
    name:
    - kubelet={{ kube_version }}
    - kubeadm={{ kube_version }}
    - kubectl={{ kube_version }}
    state: present
    update_cache: yes

- name: Activer kubelet
  systemd:
    name: kubelet
    enabled: yes
