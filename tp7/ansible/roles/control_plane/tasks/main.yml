---
- name: kubeadm init
  command: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: k8s_init

- name: Créer répertoire kubeconfig
  file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    mode: 0700

- name: Copier kubeconfig
  command: cp /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
  args:
    creates: /home/{{ ansible_user }}/.kube/config

- name: Changer permissions kubeconfig
  file:
    path: /home/{{ ansible_user }}/.kube/config
    owner: "{{ ansible_user }}"

- name: Récupérer join command (token) pour les workers
  command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false  # ne marque pas la tâche comme modifiée si elle est déjà générée

- name: Définir join command fact pour les workers
  set_fact:
    worker_join: "{{ join_cmd.stdout }}"
