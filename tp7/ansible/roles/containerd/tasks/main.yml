---
- name: Ajouter keyring Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Ajouter repo Docker
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable

- name: Installer containerd
  apt:
    name: containerd.io=1.7.27-1
    state: present
    update_cache: yes

- name: Créer config containerd si absente
  command: containerd config default
  register: containerd_cfg
  args:
    creates: /etc/containerd/config.toml
  notify: restart containerd

- name: Ensure containerd is enabled and running
  service:
    name: containerd
    enabled: yes
    state: started

- name: Remove existing containerd config if SystemdCgroup absent
  file:
    path: /etc/containerd/config.toml
    state: absent
  when: containerd_config.content is defined and
        ('SystemdCgroup' not in (containerd_config.content | b64decode))

# 2. Create directory
- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

# 3. Generate default config
- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml

# 4. Set SystemdCgroup to true (Crucial!)
- name: Set SystemdCgroup to true in config.toml
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: Charger modules kernel persistants
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Charger modules immédiatement
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configurer sysctl
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: '0644'

- name: Appliquer sysctl
  command: sysctl --system
