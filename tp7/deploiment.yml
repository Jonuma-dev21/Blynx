---
- name: Déployer et exécuter les scripts Q* sur la VM
  hosts: control_plane
  become: yes
  vars:
    local_q_files: "./replica*"   # chemin local vers les fichiers Q*
    remote_dir: "/home/{{ ansible_user }}/q_scripts"  # dossier sur la VM
    script_to_run: "{{ script_name | default('replica.sh') }}"

  tasks:
    - name: Créer le dossier sur la VM
      file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copier les fichiers Q* vers la VM
      copy:
        src: "{{ item }}"
        dest: "{{ remote_dir }}/"
        mode: '0755'
      loop: "{{ lookup('fileglob', local_q_files, wantlist=True) }}"

    - name: Exécuter Q3.sh en tant 
      become: no
      command: "bash {{ remote_dir }}/{{ script_to_run }}"
      args:
        chdir: "{{ remote_dir }}"