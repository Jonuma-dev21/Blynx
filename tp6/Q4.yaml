apiVersion: v1
kind: Service
metadata:
  name: postgres-netflix-service
spec:
  type: NodePort
  selector:
    app: postgres-netflix
  ports:
    - protocol: TCP
      port: 5432        # port interne du cluster
      targetPort: 5432  # port du container PostgreSQL
      nodePort: 32345   # port exposé sur Minikube
