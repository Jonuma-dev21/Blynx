---
- name: Déployer et exécuter les scripts Q* sur la VM
  hosts: serveur1
  become: yes
  vars:
    local_q_files: "./Q*"   # chemin local vers les fichiers Q*
    remote_dir: "/home/ubuntu/q_scripts"  # dossier sur la VM

  tasks:
    - name: Créer le dossier sur la VM
      file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copier les fichiers Q* vers la VM
      copy:
        src: "{{ item }}"
        dest: "{{ remote_dir }}/"
        mode: '0755'
      loop: "{{ lookup('fileglob', local_q_files, wantlist=True) }}"

    - name: Exécuter Q3.sh en tant qu'utilisateur ubuntu
      become: no
      command: "bash {{ remote_dir }}/Q3.sh"
      args:
        chdir: "{{ remote_dir }}"
