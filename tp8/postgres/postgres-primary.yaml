# tp8/postgres-primary.yaml
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary-svc
  labels:
    app: postgres
    role: primary
spec:
  ports:
  - port: 5432
    name: db
  clusterIP: None
  selector:
    app: postgres
    role: primary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
spec:
  serviceName: "postgres-primary-svc"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      role: primary
  template:
    metadata:
      labels:
        app: postgres
        role: primary
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: postgres
        image: public.ecr.aws/docker/library/postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: postgres
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 5432
          name: db
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /config
        command: ["/bin/bash", "/config/init.sh"]
      volumes:
      - name: config
        configMap:
          name: postgres-config
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"  
      resources:
        requests:
          storage: 3Gi
