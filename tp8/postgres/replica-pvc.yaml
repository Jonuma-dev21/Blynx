---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-pv-primary-1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/postgres-replica-1"
  storageClassName: standard

